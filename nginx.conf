# First server block - handles HTTP traffic on port 80
# Redirects all HTTP requests to HTTPS
server {
    # Listen for HTTP traffic on port 80
    listen 80;

    # Log HTTP requests before redirecting
    access_log /var/log/nginx/access.log main;

    # 301 is a permanent redirect - sends all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# Second server block - handles HTTPS traffic on port 443
server {
    # Listen for HTTPS traffic on port 443
    listen 443 ssl;

    # Path to the SSL certificate inside the container
    ssl_certificate /etc/nginx/certs/cert.crt;

    # Path to the private key inside the container
    ssl_certificate_key /etc/nginx/certs/cert.key;

    # Log all HTTPS requests to the access log
    access_log /var/log/nginx/access.log main;

    # Log errors to the error log
    error_log /var/log/nginx/error.log warn;

    # Define what to serve when someone visits the root path
    location / {
        # Look for files in this directory inside the container
        root /usr/share/nginx/html;

        # Serve index.html by default
        index index.html;
    }
}