services:
  # Defines the web service
  web:
  # Builds the image from dockerfile in current directory
    build: .
    ports:
      # Map port 8080 on the host to port 80 in the container (HTTP)
      - "8080:80"
      # Map port 8443 on the host to port 443 in the container (HTTPS)
      - "8443:443"